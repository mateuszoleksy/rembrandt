[project]
name = "rembrandt"
version = "0.1.0"
description = "Modern tool for generating ASCII art"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.1",
    "textual>=0.50",
]

[project.scripts]
rembrandt = "rembrandt.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
